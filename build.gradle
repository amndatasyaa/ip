plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

checkstyle {
    toolVersion = '11.0.0'
}

repositories {
    mavenCentral()
}

String osName = System.getProperty('os.name').toLowerCase()
String osArchitecture = System.getProperty('os.arch').toLowerCase()
boolean isArm = osArchitecture.contains('aarch64') || osArchitecture.contains('arm64')
String javaFxPlatform
if (osName.contains('win')) {
    javaFxPlatform = 'win'
} else if (osName.contains('mac')) {
    javaFxPlatform = isArm ? 'mac-aarch64' : 'mac'
} else if (osName.contains('linux')) {
    javaFxPlatform = isArm ? 'linux-aarch64' : 'linux'
} else {
    throw new GradleException("Unsupported operating system for JavaFX: ${osName}")
}

dependencies {
    String javaFxVersion = '17.0.7'
    String jUnitVersion = '5.14.4'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxPlatform}")

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }

    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                'snoopy/Launcher.class',
                'snoopy/gui/**'
        ])
    }))

    reports {
        csv.required = true
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                'snoopy/Launcher.class',
                'snoopy/gui/**'
        ])
    }))

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

application {
    mainClass = 'snoopy.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'snoopy.jar'
}

run {
    standardInput = System.in
}
